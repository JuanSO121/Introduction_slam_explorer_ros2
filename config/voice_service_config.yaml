service:
  name: "tutorial_pkg_voice_service"
  version: "1.0.0"
  debug: false

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1

ros2:
  voice_commands_topic: "/voice_commands"
  ai_context_topic: "/ai_context"
  voice_feedback_topic: "/voice_feedback"
  ai_status_topic: "/ai_status"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

cors:
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "DELETE"]
  allow_headers: ["*"]