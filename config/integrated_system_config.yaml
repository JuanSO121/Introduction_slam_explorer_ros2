# ~/ros2_ws/src/tutorial_pkg/config/integrated_system_config.yaml
# Configuración centralizada para el sistema integrado de exploración - VERSIÓN CORREGIDA

# =================================================================
# CONFIGURACIÓN DEL COORDINADOR CENTRAL
# =================================================================
robot_control_coordinator:
  ros__parameters:
    # Prioridades de control (0 = máxima prioridad)
    emergency_priority: 0
    voice_priority: 1
    manual_priority: 2
    recovery_priority: 3
    system_priority: 4
    exploration_priority: 5
    
    # Configuración de colas y timeouts
    max_queue_size: 15
    state_timeout: 300.0  # 5 minutos
    heartbeat_interval: 2.0
    request_cleanup_interval: 10.0
    
    # Configuración de velocidades por defecto
    default_linear_speed: 0.2
    default_angular_speed: 0.3
    emergency_stop_timeout: 2.0
    
    # Logging y debugging
    enable_detailed_logging: true
    log_state_transitions: true
    log_command_execution: true
    
    # Frame configuration
    use_sim_time: true
    robot_base_frame: "base_footprint"
    odom_frame: "odom"

# =================================================================
# CONFIGURACIÓN DEL MONITOR DE EXPLORACIÓN
# =================================================================
enhanced_exploration_monitor:
  ros__parameters:
    # Configuración básica
    use_sim_time: true
    
    # Timeouts de monitoreo
    map_growth_timeout: 60.0
    position_stuck_timeout: 45.0
    recovery_attempt_timeout: 30.0
    
    # Parámetros de exploración
    min_frontier_distance: 1.0
    max_exploration_distance: 8.0
    frontier_min_size: 3
    frontier_history_size: 30
    
    # Configuración de análisis
    coverage_complete_threshold: 0.90
    coverage_low_threshold: 0.30
    monitoring_frequency: 3.0
    status_publish_frequency: 5.0
    
    # Habilitación de componentes
    monitoring_enabled: true
    recovery_enabled: true
    frontier_analysis_enabled: true

# =================================================================
# CONFIGURACIÓN DEL SISTEMA DE VOZ IA
# =================================================================
integrated_ai_voice_commander:
  ros__parameters:
    # Configuración básica
    use_sim_time: true
    
    # Configuración de comandos de voz
    linear_speed_default: 0.2
    angular_speed_default: 0.3
    speed_increment: 0.05
    max_linear_speed: 0.5
    max_angular_speed: 0.8
    min_linear_speed: 0.05
    min_angular_speed: 0.1
    
    # Configuración de IA
    enable_ai_responses: true
    ai_response_timeout: 10.0
    command_confidence_threshold: 0.5
    
    # Timeouts y logging
    command_timeout: 10.0
    log_voice_commands: true
    enable_command_suggestions: true
    max_command_history: 20

# =================================================================
# CONFIGURACIÓN DEL FLUTTER BRIDGE
# =================================================================
flutter_bridge_node:
  ros__parameters:
    # Configuración básica
    use_sim_time: true
    
    # Configuración del servidor Flask
    flask_port: 8000
    flask_host: "0.0.0.0"
    enable_websocket: true
    websocket_heartbeat_interval: 30.0
    
    # Configuración de audio
    enable_voice_processing: true
    max_audio_duration: 30
    audio_sample_rate: 16000
    max_file_size_mb: 10
    allowed_audio_formats: ["wav", "mp3", "m4a", "ogg"]
    
    # Configuración de IA
    enable_ai_integration: true
    ai_response_max_length: 200
    ai_context_memory: 5
    
    # Configuración de seguridad
    rate_limit_requests_per_minute: 30
    enable_request_logging: true
    max_concurrent_connections: 10
    
    # Integración con tutorial_pkg
    coordinator_integration: true
    real_time_status_updates: true

# =================================================================
# CONFIGURACIÓN DE SLAM TOOLBOX
# =================================================================
slam_toolbox:
  ros__parameters:
    # Configuración básica
    use_sim_time: true
    
    # Frame configuration
    odom_frame: "odom"
    map_frame: "map"
    base_frame: "base_footprint"
    scan_topic: "/scan"
    
    # Map parameters
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_publish_period: 0.02
    map_update_interval: 5.0
    
    # Loop closure parameters
    do_loop_closing: true
    loop_match_minimum_score: 0.5
    loop_match_maximum_distance: 3.0
    
    # Processing parameters
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    
    # Matcher parameters
    loop_search_maximum_distance: 3.0
    loop_search_space_dimension: 8.0
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    
    # Link match minimum response fine
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    
    # Scan matcher parameters  
    use_response_expansion: true
    use_angle_restricted_scans: false
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    
    # General Parameters
    stack_size_to_use: 40000000
    enable_interactive_mode: true

# =================================================================
# CONFIGURACIÓN DE NAVIGATION2
# =================================================================

# Global Costmap
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      robot_base_frame: "base_footprint"
      global_frame: "map"
      robot_radius: 0.15
      
      # Update and publish frequencies
      update_frequency: 1.0
      publish_frequency: 1.0
      
      # Resolution and size
      resolution: 0.05
      track_unknown_space: true
      unknown_cost_value: 255
      
      # Plugins
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      # Static layer (for pre-loaded maps)
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true
        
      # Obstacle layer (for dynamic obstacles)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          
      # Inflation layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
        enabled: true

# Local Costmap  
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      robot_base_frame: "base_footprint"
      global_frame: "odom"
      robot_radius: 0.15
      
      # Update and publish frequencies
      update_frequency: 5.0
      publish_frequency: 2.0
      
      # Size and resolution
      resolution: 0.05
      width: 3
      height: 3
      
      # Rolling window
      rolling_window: true
      track_unknown_space: false
      unknown_cost_value: 255
      
      # Plugins
      plugins: ["voxel_layer", "inflation_layer"]
      
      # Voxel layer (3D obstacle detection)
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: "scan"
        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          
      # Inflation layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2
        enabled: true

# Planner Server
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# Controller Server
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
      
    # Goal checker parameters
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      
    # DWB Controller parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# Recovery Server
recoveries_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    
    spin:
      plugin: "nav2_recoveries/Spin"
      
    backup:
      plugin: "nav2_recoveries/BackUp"
      
    wait:
      plugin: "nav2_recoveries/Wait"

# Behavior Tree Navigator
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: "map"
    robot_base_frame: "base_footprint"
    odom_topic: "/odom"
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

# Waypoint Follower
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 200

# =================================================================
# CONFIGURACIÓN DE EXPLORE LITE
# =================================================================
explore:
  ros__parameters:
    # Configuración básica
    use_sim_time: true
    
    # Robot parameters
    robot_base_frame: "base_footprint"
    costmap_topic: "/global_costmap/costmap"
    costmap_updates_topic: "/global_costmap/costmap_updates"
    
    # Exploration parameters
    visualize: true
    planner_frequency: 0.33
    progress_timeout: 30.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.2
    
    # Frontier parameters
    min_frontier_size: 0.5
    frontier_travel_point: "centroid"

# =================================================================
# CONFIGURACIÓN ADICIONAL DEL SISTEMA
# =================================================================
system_monitoring:
  ros__parameters:
    # Configuración de monitoreo del sistema
    enable_performance_monitoring: true
    enable_resource_monitoring: true
    enable_network_monitoring: false
    
    # Thresholds de alerta
    cpu_usage_warning_threshold: 80.0
    memory_usage_warning_threshold: 85.0
    disk_usage_warning_threshold: 90.0
    
    # Intervalos de monitoreo
    performance_check_interval: 30.0
    resource_check_interval: 60.0
    health_check_interval: 10.0
    
    # Logging
    enable_system_logs: true
    log_level: "INFO"
    max_log_file_size_mb: 100